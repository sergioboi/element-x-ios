name: Xcode remote cache UnitTests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODE_PATH: /Applications/Xcode_26.5.0.app/Contents/Developer
  ELEMENT_CACHE_MODE: remote
  ELEMENT_SCHEME: UnitTests
  ELEMENT_TEST_PLAN: UnitTests
  ELEMENT_DESTINATION: 'platform=iOS Simulator,name=iPhone 17,OS=26.5,arch=arm64'

jobs:
  unit-tests:
    name: UnitTests remote cache
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1.2.5
        with:
          persist-credentials: false

      - name: Setup environment
        run: source ci_scripts/ci_common.sh && setup_github_actions_environment

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Install xcodecacheprog
        run: ./.github/scripts/install-xcodecacheprog.sh

      - name: Validate remote cache setup
        env:
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: ./.github/scripts/check-element-xcode-cache-setup.sh --cache-mode remote

      - name: Build UnitTests for testing with remote cache
        env:
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: |
          ./.github/scripts/clean-element-derived-data.sh
          ./.github/scripts/run-element-remote-cached-build.sh

      - name: Test UnitTests with xcodecacheprog
        env:
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: ./.github/scripts/run-element-xcodecacheprog-test.sh --ignore-non-cacheable

      - name: Upload xcodecacheprog test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodecacheprog-UnitTests-diagnostics
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/xcodecacheprog-test-cache-keys.json
            ${{ github.workspace }}/xcodecacheprog-test-graph.json
            ${{ github.workspace }}/xcodecacheprog-test-graph-hashes.json
